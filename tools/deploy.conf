# Ziele von tools/cyon-deploy.sh (keine Geheimnisse; Pfade relativ zum Home auf cyon).
# PROD_BRANCH ist der Zweig, dem die Produktion folgt. Während U1a und U1b der Nutzerverwaltung steht er
# auf «stable» (dringende Korrekturen gehen dorthin und werden nach main übernommen), ab U1c wieder auf «main».
PROD_DIR='public_html/tafula.top'
PROD_URL='https://tafula.top'
PROD_BRANCH='main'
TEST_DIR='public_html/test.tafula.top'
TEST_URL='https://test.tafula.top'
TEST_BRANCH='main'
# Inhalt der .user.ini der Testinstanz (open_basedir); --check vergleicht ihn.
TEST_USER_INI='open_basedir = "/home/subconsc/public_html/test.tafula.top/:/tmp/"'
